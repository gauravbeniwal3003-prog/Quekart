      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Flat 402, Block B, Green Heights, Vaishali Nagar",

    <!-- Structured Data 2: WebSite with Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://quekart.in/#website",
      "url": "https://quekart.in",
      "name": "QueKart Wholesale Marketplace",
      "publisher": {
        "@id": "https://quekart.in/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://quekart.in/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data 3: OnlineStore & Wholesale Center -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "@id": "https://quekart.in/#store",
      "name": "QueKart Online Wholesale Store",
      "url": "https://quekart.in/shop",
      "parentOrganization": {
        "@id": "https://quekart.in/#organization"
      },
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash on Delivery, UPI, Credit Card, Debit Card, Net Banking",
      "priceRange": "₹49 - ₹9999",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "hasOfferCatalog": {

          },
          {
            "@type": "OfferCatalog",

          }
        ]
      }
    }

    <!-- Structured Data 4: FAQPage for High-Intent Google Search Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is QueKart?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "QueKart is India's premier wholesale e-commerce platform operated by PASI E-COMMERCE SERVICES. It connects retail shoppers and resellers directly with factory manufacturers in Surat, Jaipur, Panipat, and Delhi at authentic wholesale rates."
          }
        },
        {
          "@type": "Question",
          "name": "How is QueKart an alternative to Meesho, Flipkart, and Amazon?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Unlike traditional marketplaces that charge 10% to 25% commission from sellers or mark up prices through reseller layers, QueKart charges 0% commission to suppliers, allowing buyers to purchase single pieces at direct factory wholesale prices."
          }
        },
        {
          "@type": "Question",
          "name": "Is Cash on Delivery (COD) available on QueKart?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, QueKart offers 100% Cash on Delivery across all 27,000+ pin codes in India with easy 7-day doorstep replacement and return support."
          }
        },
        {
          "@type": "Question",
          "name": "How can I sell on QueKart with 0% commission?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Manufacturers, wholesalers, and small businesses can register on QueKart's vendor portal in 2 minutes with mobile verification and basic bank details with zero onboarding fee and 0% sales commission."
          }
        }
      ]
    }
    </script>
